<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Scanner — DLP AI Console</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>
  <div class="content">
    <div class="content-header">
      <div><h1>Secret Scanner</h1><div class="sub">Scans code files sent out for hardcoded secrets (API keys, passwords, tokens).</div></div>
      <a href="/history.html#secrets" class="btn secondary" style="margin-left:auto;">Full history</a>
    </div>
    <div class="content-body">

      <div class="card">
        <h3 style="margin-top:0;">Run a custom scan</h3>
        <div class="field-row">
          <div class="field"><label>From</label><input type="datetime-local" id="runBegin"></div>
          <div class="field"><label>To</label><input type="datetime-local" id="runEnd"></div>
          <div class="field"><label>Location IDs (blank = all accessible)</label><input type="text" id="locationIds" placeholder="e.g. 1001"></div>
        </div>
        <button class="btn" id="genBtn" type="button">Generate</button>
        <span id="runStatus" style="margin-left:12px; font-size:13px; color:var(--muted);"></span>
      </div>

      <div class="card" style="margin-top:20px;">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
          <h3 style="margin:0;">Scanned files</h3>
          <span id="scheduleLabel" class="schedule-badge"></span>
        </div>
        <div class="hist-controls" style="margin-top:14px;">
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="scanned">Scanned</option>
            <option value="skipped_not_code">Skipped — not code</option>
            <option value="skipped_no_copy">Skipped — no saved copy</option>
            <option value="error">Error</option>
          </select>
          <select id="fSeverity">
            <option value="">All severities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <input type="search" id="fSearch" placeholder="Search filename, destination, user…">
        </div>
        <div id="tableWrap"></div>
        <div class="pager">
          <span id="pagerInfo" style="font-size:12.5px; color:var(--muted);"></span>
          <button class="btn secondary" id="prevBtn">Previous</button>
          <button class="btn secondary" id="nextBtn">Next</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="detail-panel" id="detailPanel" style="max-width:760px;"></div>
</div>

<script src="common.js"></script>
<script src="secrets-common.js"></script>
<script>
const state = { runId: null, begin: null, end: null, limit: 50, offset: 0, severity: '', scanStatus: '', search: '' };
let runPollTimer = null;
const tableWrapEl = document.getElementById('tableWrap');

function toApiDt(inputEl) {
  if (!inputEl.value) return '';
  return inputEl.value.replace('T', ' ') + ':00';
}
function setInputToDate(inputEl, date, endOfDay) {
  const pad = n => String(n).padStart(2, '0');
  const d = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
  inputEl.value = `${d}T${endOfDay ? '23:59' : '00:00'}`;
}

document.getElementById('genBtn').onclick = async () => {
  const begin = toApiDt(document.getElementById('runBegin'));
  const end = toApiDt(document.getElementById('runEnd'));
  if (!begin || !end) { alert('Pick a From/To range first.'); return; }
  const locationIds = document.getElementById('locationIds').value.trim();
  document.getElementById('genBtn').disabled = true;
  const params = new URLSearchParams({ begin, end, location_ids: locationIds });
  const res = await api('/api/secrets/runs?' + params.toString(), { method: 'POST' });
  const r = await res.json();
  if (r.started === false) {
    document.getElementById('runStatus').textContent = r.message;
    document.getElementById('genBtn').disabled = false;
    return;
  }
  state.runId = r.run_id;
  pollRun();
};

async function pollRun() {
  if (runPollTimer) return;
  const runStatus = document.getElementById('runStatus');
  runPollTimer = setInterval(async () => {
    const r = await (await api('/api/secrets/runs/' + state.runId)).json();
    if (r.status === 'running') {
      runStatus.textContent = `seen ${r.files_seen||0} · code files ${r.files_code_type||0} · scanned ${r.files_scanned||0} · with findings ${r.files_with_findings||0}`;
    } else {
      clearInterval(runPollTimer); runPollTimer = null;
      document.getElementById('genBtn').disabled = false;
      runStatus.textContent = r.status === 'failed'
        ? `run failed: ${(r.error||'').slice(0,150)}`
        : `done — seen ${r.files_seen||0} · code files ${r.files_code_type||0} · scanned ${r.files_scanned||0} · with findings ${r.files_with_findings||0}`;
      state.offset = 0;
      state.begin = null; state.end = null;
      setScheduleLabel('scheduleLabel', 'Just ran: ', 'custom scan results');
      loadFiles();
    }
  }, 1500);
}

async function loadFiles() {
  const params = new URLSearchParams({ limit: state.limit, offset: state.offset });
  if (state.runId) params.set('run_id', state.runId);
  if (state.begin) params.set('begin', state.begin);
  if (state.end) params.set('end', state.end);
  if (state.severity) params.set('severity', state.severity);
  if (state.scanStatus) params.set('scan_status', state.scanStatus);
  if (state.search) params.set('search', state.search);
  const data = await (await api('/api/secrets/files?' + params.toString())).json();
  renderSecretsTable(tableWrapEl, data, 'No files scanned in this window yet.');
  document.getElementById('pagerInfo').textContent = `${data.total ? state.offset + 1 : 0}–${Math.min(state.offset + data.files.length, data.total)} of ${data.total}`;
  document.getElementById('prevBtn').disabled = state.offset === 0;
  document.getElementById('nextBtn').disabled = state.offset + state.limit >= data.total;
}

document.getElementById('fSeverity').onchange = e => { state.severity = e.target.value; state.offset = 0; loadFiles(); };
document.getElementById('fStatus').onchange = e => { state.scanStatus = e.target.value; state.offset = 0; loadFiles(); };
let searchDebounce;
document.getElementById('fSearch').oninput = e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { state.search = e.target.value; state.offset = 0; loadFiles(); }, 300);
};
document.getElementById('prevBtn').onclick = () => { state.offset = Math.max(0, state.offset - state.limit); loadFiles(); };
document.getElementById('nextBtn').onclick = () => { state.offset += state.limit; loadFiles(); };
document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeSecretsDetail(); };

(async () => {
  await initPage('secrets');
  setInputToDate(document.getElementById('runBegin'), new Date(), false);
  setInputToDate(document.getElementById('runEnd'), new Date(), true);

  const range = computeSecretsScheduleRange();
  const apiRange = toApiDateRange(range);
  state.begin = apiRange.begin;
  state.end = apiRange.end;
  setScheduleLabel('scheduleLabel', 'Scheduled results: ', formatScheduleLabel(range));
  loadFiles();
})();
</script>
</body>
</html>
