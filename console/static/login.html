<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLP AI Console — Log in</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <span class="brand-logo-text">DLP AI</span>
  <div class="auth-card">
    <h1>DLP AI Console</h1>
    <div class="sub">Sign in to continue.</div>
    <form id="loginForm">
      <div class="auth-field"><label>Username</label><input type="text" id="username" autocomplete="username" required autofocus></div>
      <div class="auth-field"><label>Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="auth-btn" type="submit">Log in</button>
      <div class="auth-error" id="err"></div>
    </form>
  </div>
</div>
<script>
async function checkStatus() {
  const res = await fetch('/api/auth/status');
  const data = await res.json();
  if (data.setup_required) window.location.href = '/setup.html';
}
checkStatus();

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'Login failed');
    }
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || '/';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
