<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLP AI Console — Initial setup</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <span class="brand-logo-text">DLP AI</span>
  <div class="auth-card">
    <h1>Welcome</h1>
    <div class="sub">Create the primary admin account. This account can never be demoted or deleted.</div>
    <form id="setupForm">
      <div class="auth-field"><label>Username</label><input type="text" id="username" autocomplete="username" required autofocus></div>
      <div class="auth-field"><label>Password</label><input type="password" id="password" autocomplete="new-password" required minlength="8"></div>
      <div class="auth-field"><label>Confirm password</label><input type="password" id="password2" autocomplete="new-password" required minlength="8"></div>
      <button class="auth-btn" type="submit">Create admin account</button>
      <div class="auth-error" id="err"></div>
    </form>
  </div>
</div>
<script>
async function checkStatus() {
  const res = await fetch('/api/auth/status');
  const data = await res.json();
  if (!data.setup_required) window.location.href = '/login.html';
}
checkStatus();

document.getElementById('setupForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) { err.textContent = 'Passwords do not match'; return; }
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'Setup failed');
    }
    window.location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
